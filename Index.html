<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - DevPlatform</title>
    <link rel="stylesheet" href="css/Styles.css">
</head>

<body class="login-body">
    <main class="login-container">
        <div class="login-card">

            <div class="login-logo">
                Dev<span>Platform</span>
            </div>

            <p class="login-descripcion">
                Ingresa tus credenciales para acceder al panel de control
            </p>

            <form>

                <div class="campo">

                    <label for="correo">
                        Correo Electrónico *
                    </label>

                    <input type="email"id="correo"name="correo"placeholder="usuario@dev.com"required>
                </div>


                <!-- CONTRASEÑA -->
                <div class="campo">
                    <label for="password">
                        Contraseña *
                    </label>

                    <input type="password"id="password"name="password"placeholder="•••"minlength="6"required>
                </div>

                <div class="campo">

                    <label for="rol">
                        Rol *
                    </label>

                    <select id="rol" name="rol" required>

                        <option value="">
                            Selecciona una opción
                        </option>

                        <option value="aprendiz">
                            Aprendiz
                        </option>

                        <option value="instructor">
                            Instructor
                        </option>

                        <option value="administrador">
                            Administrador
                        </option>

                    </select>

                </div>


                <!-- TERMINOS -->
                <div class="terminos">

                    <input
                        type="checkbox"
                        id="terminos"
                        required
                    >

                    <label for="terminos">
                        Acepto los términos de servicio y políticas de privacidad
                    </label>

                </div>


                <!-- BOTON -->
                <a href="Dashboard.html" class="btn-login">
                    Ingresar al Dashboard
                </a>

            </form>

        </div>

    </main>

</body>

</html>
